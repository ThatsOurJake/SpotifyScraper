kind: pipeline
type: docker
name: default

steps:
  - name: build
    image: plugins/docker:latest
    settings:
      auto_tag: false
      username:
        from_secret: sussy_docker_username
      password:
        from_secret: sussy_docker_password
      registry: registry.sussy-servers.uk
      repo: registry.sussy-servers.uk/public/song_saver
      tags:
        - latest
        - ${DRONE_COMMIT_SHA:0:8}
